# v3.5 = "best of both" focal placement. Identical to v3 EXCEPT the focal (1-p)^2
# modulation is restricted to the rare bracket tier; the common fillers revert to
# v2's flat alpha=2.0 weighted CE (no focal). The hypothesis (v3.md, line 51): keep
# v3's tail recall on the rare brackets while recovering v2's filler precision.
#
# Deltas vs v3 (qwen2_audio_lora_v3.yaml):
#   - focal_tokens: focal gamma=2 now applies ONLY to the 4 rare alpha=3.0 brackets.
#   - disfluency_loss_weights: common fillers go 1.5 -> 2.0 (v2's flat weight); rare
#     brackets stay 3.0. (Common tokens now also get NO focal, per focal_tokens.)
#   - eval_start_epoch: 10 -> skip the slow every-2-epoch evals before epoch 10.

model_name_or_path: Qwen/Qwen2-Audio-7B-Instruct
output_dir: /scratch/nathan/lora_run/outputs/qwen2-audio-dementia-lora-v3_5

data:
  train_manifest: /scratch/merged_data_80_20/train/manifest.jsonl
  validation_manifest: /scratch/merged_data_80_20/test/manifest.jsonl
  audio_column: audio_path
  text_column: text
  sampling_rate: 16000

special_tokens:
  - '[short-pause]'
  - '[medium-pause]'
  - '[long-pause]'
  - '[unclear-speech]'
  - '[laughter]'
  - '[non-verbal]'
  - '[uh]'
  - '[um]'
disfluency_tokens:
  - '[short-pause]'
  - '[medium-pause]'
  - '[long-pause]'
  - '[unclear-speech]'
  - '[laughter]'
  - '[non-verbal]'
  - '[uh]'
  - '[um]'

# Alpha weights: rare brackets upweighted (3.0, as v3); common fillers at v2's flat
# 2.0. The focal (1-p)^2 reshaping is applied ONLY to the focal_tokens below.
disfluency_loss_weight: 2.0
disfluency_loss_weights:
  '[uh]': 2.0             # 1127  (common, flat, no focal)
  '[unclear-speech]': 2.0 # 945   (common, flat, no focal)
  '[um]': 2.0             # 410   (common, flat, no focal)
  '[short-pause]': 2.0    # 354   (common, flat, no focal)
  '[long-pause]': 3.0     # 233   (rare,  focal)
  '[medium-pause]': 3.0   # 143   (rare,  focal)
  '[laughter]': 3.0       # 93    (rare,  focal)
  '[non-verbal]': 3.0     # 87    (rare,  focal)
focal_gamma: 2.0
focal_tokens:
  - '[long-pause]'
  - '[medium-pause]'
  - '[laughter]'
  - '[non-verbal]'

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  audio_encoder_top_half_only: false
  use_dora: false
  target_modules:
    - q_proj
    - v_proj
  modules_to_save:
    - embed_tokens
    - lm_head
    - multi_modal_projector
  audio_encoder_layers: [24, 25, 26, 27, 28, 29, 30, 31]
  audio_encoder_rank: 8
  audio_encoder_alpha: 16
  audio_encoder_target_modules: [q_proj, v_proj]

param_group_lrs:
  encoder_lora: 1.0e-4
  projector:    1.0e-3
  lm_lora:      2.0e-4
  new_tokens:   1.0e-3

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4

num_train_epochs: 16
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 5

eval_steps: 83
save_steps: 166
save_total_limit: 8

bf16: true
fp16: false
gradient_checkpointing: true
use_4bit: false
seed: 42
report_to: wandb

run_pre_post_train_eval: true
epoch_eval_interval: 2
eval_start_epoch: 10

wandb:
  entity: lord-of-the-strings
  project: audiollm-d
  name: qwen2-audio-dementia-lora-v3_5
  tags:
    - lora
    - v3.5
    - phase1
    - focal-rare-only
  log_model: false
