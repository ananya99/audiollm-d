# v4 = Phase 2: v3 (tiered focal, r=16 LoRA, encoder r=8 layers 24-31) + an auxiliary CTC
# head on the post-pooling audio-encoder features (25 fps), trained jointly with the LM head.
#
# Deltas vs v3 (qwen2_audio_lora_v3.yaml):
#   - ctc: enabled, alpha=0.3 (the ticket's starting point; sweep {0.1,0.5} via the a01/a05 configs).
#   - param_group_lrs.ctc_head: 1.0e-3 (new randomly-initialised head; same tier as new tokens).
# Everything else is held identical to v3 so the Phase 1->2 comparison is clean.

model_name_or_path: Qwen/Qwen2-Audio-7B-Instruct
output_dir: /scratch/nathan/lora_run/outputs/qwen2-audio-dementia-lora-v4-ctc-a05

data:
  train_manifest: /scratch/merged_data_80_20/train/manifest.jsonl
  validation_manifest: /scratch/merged_data_80_20/test/manifest.jsonl
  audio_column: audio_path
  text_column: text
  sampling_rate: 16000

special_tokens:
  - '[short-pause]'
  - '[medium-pause]'
  - '[long-pause]'
  - '[unclear-speech]'
  - '[laughter]'
  - '[non-verbal]'
  - '[uh]'
  - '[um]'
disfluency_tokens:
  - '[short-pause]'
  - '[medium-pause]'
  - '[long-pause]'
  - '[unclear-speech]'
  - '[laughter]'
  - '[non-verbal]'
  - '[uh]'
  - '[um]'

disfluency_loss_weight: 2.0
disfluency_loss_weights:
  '[uh]': 1.5
  '[unclear-speech]': 1.5
  '[um]': 1.5
  '[short-pause]': 1.5
  '[long-pause]': 3.0
  '[medium-pause]': 3.0
  '[laughter]': 3.0
  '[non-verbal]': 3.0
focal_gamma: 2.0

# Phase 2 auxiliary CTC head. labels_dir is the build_ctc_labels.py output root (holds
# labels/{clip_id}.npy + ctc_vocab.json). classes omitted -> the artifact's full vocab is used.
ctc:
  enabled: true
  labels_dir: /scratch/nathan/lora_run/ctc_labels
  alpha: 0.5

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  audio_encoder_top_half_only: false
  use_dora: false
  target_modules:
    - q_proj
    - v_proj
  modules_to_save:
    - embed_tokens
    - lm_head
    - multi_modal_projector
  audio_encoder_layers: [24, 25, 26, 27, 28, 29, 30, 31]
  audio_encoder_rank: 8
  audio_encoder_alpha: 16
  audio_encoder_target_modules: [q_proj, v_proj]

param_group_lrs:
  encoder_lora: 1.0e-4
  projector:    1.0e-3
  lm_lora:      2.0e-4
  new_tokens:   1.0e-3
  ctc_head:     1.0e-3

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4

num_train_epochs: 16
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 5

eval_steps: 83
save_steps: 166
save_total_limit: 8

bf16: true
fp16: false
gradient_checkpointing: true
use_4bit: false
seed: 42
report_to: wandb

run_pre_post_train_eval: true
epoch_eval_interval: 2

wandb:
  entity: lord-of-the-strings
  project: audiollm-d
  name: qwen2-audio-dementia-lora-v4-ctc-a05
  tags:
    - lora
    - v4
    - phase2
    - ctc
  log_model: false
