# v5 (ADReSS subset, BINARY pause vocab) — the now-legitimate acoustic-label experiment.
#
# Context (docs/v5_finding_stitched_silence.md): the stitched clips contained a 0.6s digital-zero
# pad between turns, so VAD silence was a transcript-correlated artifact. Fix: Stage 0 acoustic VAD
# now excises the exact-zero pads (drop_zero_inserts), recovering REAL acoustic pauses. Those are
# only reliably present on the clean ADReSS subset (S### clips); the noisy Pitt/PPA clips have
# breath-filled pauses an energy VAD can't ground, so they are excluded here.
#
# Stage-1 GATE on the ADReSS subset (insert-excised): agreement 0.73, verdict COLLAPSE -> use a
# BINARY {speech, pause} CTC vocab rather than the 4-class duration tiers (they don't separate).
#
# Deltas vs configs/qwen2_audio_lora_v5.yaml — and NOTHING else (variable isolated):
#   - data.train/validation_manifest -> the ADReSS-only subset.
#   - ctc.labels_dir  -> the binary Stage-2 labels (ctc_labels_binary).
#   - ctc.classes     -> [speech, pause]  (must agree with that dir's ctc_vocab.json).
#   - output_dir / wandb name / tags -> v5-adress-binary.
# FROZEN: top-8 encoder LoRA (24-31, r=8), tiered focal LM loss, alpha=0.3, all LRs, schedule, eval.

model_name_or_path: Qwen/Qwen2-Audio-7B-Instruct
output_dir: /scratch/nathan/lora_run/outputs/qwen2-audio-dementia-lora-v5-adress-binary-a03

data:
  train_manifest: /scratch/nathan/lora_run/v5_adress/train_manifest.jsonl
  validation_manifest: /scratch/nathan/lora_run/v5_adress/test_manifest.jsonl
  audio_column: audio_path
  text_column: text
  sampling_rate: 16000

special_tokens:
  - '[short-pause]'
  - '[medium-pause]'
  - '[long-pause]'
  - '[unclear-speech]'
  - '[laughter]'
  - '[non-verbal]'
  - '[uh]'
  - '[um]'
disfluency_tokens:
  - '[short-pause]'
  - '[medium-pause]'
  - '[long-pause]'
  - '[unclear-speech]'
  - '[laughter]'
  - '[non-verbal]'
  - '[uh]'
  - '[um]'

disfluency_loss_weight: 2.0
disfluency_loss_weights:
  '[uh]': 1.5
  '[unclear-speech]': 1.5
  '[um]': 1.5
  '[short-pause]': 1.5
  '[long-pause]': 3.0
  '[medium-pause]': 3.0
  '[laughter]': 3.0
  '[non-verbal]': 3.0
focal_gamma: 2.0

# v5 auxiliary CTC head — acoustically-grounded VAD labels (binary, insert-excised).
ctc:
  enabled: true
  labels_dir: /scratch/nathan/lora_run/v5_adress/ctc_labels_binary
  alpha: 0.3
  classes:
    - speech
    - pause

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  audio_encoder_top_half_only: false
  use_dora: false
  target_modules:
    - q_proj
    - v_proj
  modules_to_save:
    - embed_tokens
    - lm_head
    - multi_modal_projector
  audio_encoder_layers: [24, 25, 26, 27, 28, 29, 30, 31]
  audio_encoder_rank: 8
  audio_encoder_alpha: 16
  audio_encoder_target_modules: [q_proj, v_proj]

param_group_lrs:
  encoder_lora: 1.0e-4
  projector:    1.0e-3
  lm_lora:      2.0e-4
  new_tokens:   1.0e-3
  ctc_head:     1.0e-3

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4

num_train_epochs: 16
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 5

eval_steps: 83
save_steps: 166
save_total_limit: 8

bf16: true
fp16: false
gradient_checkpointing: true
use_4bit: false
seed: 42
report_to: wandb

run_pre_post_train_eval: true
epoch_eval_interval: 2

wandb:
  entity: lord-of-the-strings
  project: audiollm-d
  name: qwen2-audio-dementia-lora-v5-adress-binary-a03
  tags:
    - lora
    - v5
    - ctc
    - vad-labels
    - adress
    - binary
  log_model: false
