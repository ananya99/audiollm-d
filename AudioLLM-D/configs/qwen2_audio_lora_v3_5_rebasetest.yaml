# v3.5 REBASE TEST — identical to qwen2_audio_lora_v3_5.yaml except:
#   - num_train_epochs: 16 -> 14  (evals land at exactly 10, 12, 14; epoch-16 dropped)
#   - output_dir / wandb.name -> *_rebasetest  (keeps the real v3.5 run untouched)
# Purpose: confirm the rebase onto Sathvik's origin/main trains end-to-end and benefits
# from the better starting point. Focal-on-rare-brackets (v3.5) layered on the merged trainer.

model_name_or_path: Qwen/Qwen2-Audio-7B-Instruct
output_dir: /scratch/nathan/lora_run/outputs/qwen2-audio-dementia-lora-v3_5_rebasetest

data:
  train_manifest: /scratch/merged_data_80_20/train/manifest.jsonl
  validation_manifest: /scratch/merged_data_80_20/test/manifest.jsonl
  audio_column: audio_path
  text_column: text
  sampling_rate: 16000

special_tokens:
  - '[short-pause]'
  - '[medium-pause]'
  - '[long-pause]'
  - '[unclear-speech]'
  - '[laughter]'
  - '[non-verbal]'
  - '[uh]'
  - '[um]'
disfluency_tokens:
  - '[short-pause]'
  - '[medium-pause]'
  - '[long-pause]'
  - '[unclear-speech]'
  - '[laughter]'
  - '[non-verbal]'
  - '[uh]'
  - '[um]'

# Alpha weights: rare brackets upweighted (3.0, as v3); common fillers at v2's flat
# 2.0. The focal (1-p)^2 reshaping is applied ONLY to the focal_tokens below.
disfluency_loss_weight: 2.0
disfluency_loss_weights:
  '[uh]': 2.0             # 1127  (common, flat, no focal)
  '[unclear-speech]': 2.0 # 945   (common, flat, no focal)
  '[um]': 2.0             # 410   (common, flat, no focal)
  '[short-pause]': 2.0    # 354   (common, flat, no focal)
  '[long-pause]': 3.0     # 233   (rare,  focal)
  '[medium-pause]': 3.0   # 143   (rare,  focal)
  '[laughter]': 3.0       # 93    (rare,  focal)
  '[non-verbal]': 3.0     # 87    (rare,  focal)
focal_gamma: 2.0
focal_tokens:
  - '[long-pause]'
  - '[medium-pause]'
  - '[laughter]'
  - '[non-verbal]'

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  audio_encoder_top_half_only: false
  use_dora: false
  target_modules:
    - q_proj
    - v_proj
  modules_to_save:
    - embed_tokens
    - lm_head
    - multi_modal_projector
  audio_encoder_layers: [24, 25, 26, 27, 28, 29, 30, 31]
  audio_encoder_rank: 8
  audio_encoder_alpha: 16
  audio_encoder_target_modules: [q_proj, v_proj]

param_group_lrs:
  encoder_lora: 1.0e-4
  projector:    1.0e-3
  lm_lora:      2.0e-4
  new_tokens:   1.0e-3

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4

num_train_epochs: 14
warmup_ratio: 0.03
weight_decay: 0.0
logging_steps: 5

eval_steps: 83
save_steps: 166
save_total_limit: 8

bf16: true
fp16: false
gradient_checkpointing: true
use_4bit: false
seed: 42
report_to: wandb

run_pre_post_train_eval: true
epoch_eval_interval: 2
eval_start_epoch: 10

wandb:
  entity: lord-of-the-strings
  project: audiollm-d
  name: qwen2-audio-dementia-lora-v3_5_rebasetest
  tags:
    - lora
    - v3.5
    - phase1
    - focal-rare-only
    - rebase-test
  log_model: false
